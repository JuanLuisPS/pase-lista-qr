  <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pase de lista QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:600px;margin:20px auto;padding:16px}
button,select,input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;font-size:16px}
#lector{max-width:400px;margin:auto}
#resultado{padding:15px;background:#eee;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>Pase de lista QR</h2>

<label>Grupo</label>
<select id="grupo">
  <option value="3AIM">3AIM</option>
  <option value="3ACM">3ACM</option>
</select>

<label>Fecha de clase</label>
<input type="date" id="fecha">

<button id="iniciar">Iniciar escáner</button>
<button id="detener">Detener escáner</button>

<div id="lector"></div>
<h3>Resultado</h3>
<div id="resultado">Selecciona la fecha e inicia el escáner.</div>

<script>
const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxA8iZe3uyVRqFglLUuFa12faf5TvWXgR7aXvPvGlffe38vl7Lw2-0SyemJHkYn032y/exec";

const resultado = document.getElementById("resultado");
const fecha = document.getElementById("fecha");
fecha.value = new Date().toLocaleDateString("en-CA");

let lector = null;
let procesando = false;
let ultimoQR = "";
let ultimoTiempo = 0;

document.getElementById("iniciar").onclick = async () => {
  if (lector) return;

  if (!fecha.value) {
    resultado.textContent = "Selecciona la fecha de clase.";
    return;
  }

  try {
    lector = new Html5Qrcode("lector");

    await lector.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      async (id) => {
        if (procesando) return;

        const ahora = Date.now();
        if (id === ultimoQR && ahora - ultimoTiempo < 3000) return;

        procesando = true;
        ultimoQR = id;
        ultimoTiempo = ahora;
        resultado.textContent = "QR leído. Registrando asistencia...";

        try {
          const parametros = new URLSearchParams({
            accion: "asistencia",
            id: id,
            grupo: document.getElementById("grupo").value,
            fecha: fecha.value
          });

          const url = URL_APPS_SCRIPT + "?" + parametros.toString();

          const respuesta = await fetch(url, {
            method: "GET",
            redirect: "follow",
            mode: "cors"
          });

          if (!respuesta.ok) {
            throw new Error("Error HTTP: " + respuesta.status);
          }

          const datos = await respuesta.json();

          resultado.textContent = datos.nombre
            ? datos.nombre + "\n" + datos.mensaje
            : "Respuesta: " + JSON.stringify(datos);

        } catch (error) {
          resultado.textContent =
            "No se pudo confirmar el registro. " +
            "Verifica la implementación de Apps Script. " + error.message;
        } finally {
          procesando = false;
        }
      }
    );

    resultado.textContent = "Cámara activa. Escanea el QR del estudiante.";

  } catch (error) {
    lector = null;
    resultado.textContent = "Error de cámara: " + error.message;
  }
};

document.getElementById("detener").onclick = async () => {
  if (!lector) return;
  await lector.stop();
  await lector.clear();
  lector = null;
  resultado.textContent = "Escáner detenido.";
};
</script>
</body>
</html>
