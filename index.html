<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de lector QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }

    button {
      padding: 14px;
      width: 100%;
      margin: 10px 0;
      font-size: 17px;
    }

    #lector {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    #resultado {
      padding: 15px;
      background: #eee;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>Prueba de lector QR</h2>

  <p>Apunta al QR generado en Google Sheets.</p>

  <button id="iniciar">Iniciar escáner</button>
  <button id="detener">Detener escáner</button>

  <div id="lector"></div>

  <h3>Resultado</h3>
  <div id="resultado">Esperando un código QR...</div>

  <script>
    const resultado = document.getElementById("resultado");
    let lector = null;
    let iniciando = false;

    document.getElementById("iniciar").onclick = async function () {
      if (lector || iniciando) return;

      iniciando = true;
      resultado.textContent = "Iniciando lector...";

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("No se cargó la biblioteca de lectura QR.");
        }

        lector = new Html5Qrcode("lector");

        await lector.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: function (ancho, alto) {
              const lado = Math.floor(Math.min(ancho, alto) * 0.8);
              return { width: lado, height: lado };
            },
            aspectRatio: 1
          },
          function (texto) {
            resultado.textContent = "QR leído: " + texto;

            if (navigator.vibrate) navigator.vibrate(150);
          },
          function () {}
        );

        resultado.textContent =
          "Cámara activa. Centra el QR dentro del recuadro.";

      } catch (error) {
        resultado.textContent =
          "Error: " + (error.message || String(error));
        lector = null;

      } finally {
        iniciando = false;
      }
    };

    document.getElementById("detener").onclick = async function () {
      if (!lector) return;

      const actual = lector;
      lector = null;

      try {
        await actual.stop();
        await actual.clear();
        resultado.textContent = "Escáner detenido.";
      } catch (error) {
        resultado.textContent =
          "Error al detener: " + (error.message || String(error));
      }
    };
  </script>
</body>
</html>
