<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Escáner de asistencia QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 25px auto;
      padding: 16px;
      color: #222;
    }

    h1 {
      font-size: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
    }

    #lector {
      margin-top: 20px;
    }

    #resultado {
      background: #f0f3f5;
      border-radius: 8px;
      padding: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h1>Escáner de asistencia QR</h1>

  <p>
    Esta página permite comprobar que la cámara de tu
    celular puede leer los códigos QR de tus alumnos.
  </p>

  <button id="iniciar">Activar cámara</button>

  <button id="detener">Detener cámara</button>

  <div id="lector"></div>

  <h3>Resultado del escaneo</h3>

  <div id="resultado">
    Esperando un código QR...
  </div>

  <script>
    let scanner = null;
    let iniciando = false;
    let procesando = false;

    const resultado = document.getElementById("resultado");

    document.getElementById("iniciar").onclick = async () => {
      if (scanner || iniciando) return;

      iniciando = true;
      resultado.textContent = "Solicitando acceso a la cámara...";

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "No se pudo cargar el lector QR. Comprueba tu conexión."
          );
        }

        scanner = new Html5Qrcode("lector");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          codigo => {
            if (procesando) return;

            procesando = true;

            resultado.textContent =
              "Código leído correctamente: " + codigo;

            if (navigator.vibrate) {
              navigator.vibrate(150);
            }

            setTimeout(() => {
              procesando = false;
            }, 1500);
          },
          () => {}
        );

        resultado.textContent =
          "Cámara activa. Enfoca un código QR.";

      } catch (error) {
        scanner = null;

        resultado.textContent =
          "No se pudo activar la cámara: " + error.message;

      } finally {
        iniciando = false;
      }
    };

    document.getElementById("detener").onclick = async () => {
      if (!scanner) return;

      const actual = scanner;
      scanner = null;

      try {
        await actual.stop();
        await actual.clear();

        resultado.textContent = "Cámara detenida.";

      } catch (error) {
        resultado.textContent =
          "Error al detener la cámara: " + error.message;
      }
    };
  </script>

</body>
</html>
